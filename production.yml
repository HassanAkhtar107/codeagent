version: "3.8"

services:
  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: my_awesome_project_production_traefik
    depends_on:
      - web
      - frontend
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:5555:5555"
      - "0.0.0.0:8080:8080"
    env_file:
      - ./.env
    restart: always

  whoami:
    image: "traefik/whoami"
    container_name: "simple-service"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${HOSTNAME}`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: ./compose/production/frontend/Dockerfile
    volumes:
      - .:/frontend
    restart: always

  web:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    command: /start
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - ./.env
    depends_on:
      - redis
      - db
    restart: always

  db:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ecommerce_store_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - postgres_data_backups:/backups:z
    env_file:
      - ./.env

  redis:
    image: redis:latest
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: ecommerce_store_celery_worker
    command: /start-celeryworker
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis
      - db
    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: ecommerce_store_celery_beat
    command: /start-celerybeat
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis
      - db
    restart: always

  flower:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: ecommerce_store_celery_flower
    command: /start-flower
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis
      - db
    restart: always

volumes:
  ecommerce_store_postgres_data:
  static_volume:
  postgres_data:
  postgres_data_backups:
  production_traefik: {}
